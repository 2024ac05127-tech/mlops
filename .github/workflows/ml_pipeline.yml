name: Heart Disease MLOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install flake8

      - run: flake8 src/ 

  train:

    runs-on: ubuntu-latest

    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Train Model
        run: python src/train.py

      - name: Upload Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: heart_disease_model.pkl

  test:

    runs-on: ubuntu-latest

    needs: train

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Download Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Run Tests
        run: pytest tests/ -v
